name: Audit Dependencies

on:
  schedule:
    # Daily at 04:00 UTC, away from the busiest start-of-hour period.
    - cron: '00 4 * * *'

  push:
    branches: [main]
    paths:
      - .github/workflows/dependencies.yml
      - .github/renovate.json5

  # Refresh the dashboard after a Renovate update is merged. Run the trusted
  # base-branch workflow only; never check out or execute the PR's code.
  pull_request_target:
    types: [closed]

  # Ticking a dashboard checkbox edits the issue body; see the job guard.
  issues:
    types: [edited]

  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview changes without creating branches, PRs, or issues
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: aduit-dependencies
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate (${{ inputs.dry-run && 'dry-run' || 'apply' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Ignore the bot's own dashboard edits to avoid a loop. PR events count
    # only for merged, same-repository Renovate branches targeting the default
    # branch; closing an unmerged PR or a fork PR must not start Renovate.
    if: >-
      vars.ROBOT_APP_ID != '' &&
      (
        github.event_name != 'issues' ||
        (
          github.event.issue.title == 'Dependency Dashboard' &&
          github.event.sender.type != 'Bot'
        )
      ) &&
      (
        github.event_name != 'pull_request_target' ||
        (
          github.event.pull_request.merged == true &&
          github.event.pull_request.base.ref == github.event.repository.default_branch &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.type == 'Bot' &&
          startsWith(github.event.pull_request.head.ref, 'renovate/')
        )
      )
    steps:
      - name: Create installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.ROBOT_APP_ID }}
          private-key: ${{ secrets.ROBOT_APP_PRIVATE_KEY }}

          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

          # Scope the token to exactly what Renovate needs, even if the App
          # installation ever grows broader permissions. `statuses` is load-
          # bearing: minimumReleaseAge works via commit statuses on update
          # branches, and without it Renovate aborts right after pushing
          # ("Integration unauthorized").
          permission-checks: write
          permission-statuses: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Run Renovate
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-image: ghcr.io/renovatebot/renovate:44.221.6@sha256:52454eae0bdcb51ddfecc39035e0fc2d97172751124049144e89d44343f6ae81
          mount-docker-socket: false
        env:
          LOG_LEVEL: debug
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_AUTODISCOVER: 'false'
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          # Allow only the repository's dispatcher with one subcommand, without
          # a shell executor. The dispatcher rejects unknown subcommands.
          RENOVATE_ALLOWED_COMMANDS: '["^\\.github/renovate-cmd [a-z][a-z-]*$"]'
          RENOVATE_DRY_RUN: ${{ inputs.dry-run && 'full' || '' }}
