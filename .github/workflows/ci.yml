name: CI

on:
  push:
    branches: [main]
    tags: ["release-[0-9]*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/release-') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: true
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - id: build
        run: bash ci/build.sh
      - name: Attest build archives
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/release-'))
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: zig-out/release/SHASUMS256.txt
          create-storage-record: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build
          path: |
            zig-out/release/
            zig-out/tests/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: x86_64
            runner: windows-latest
          - os: macos
            arch: aarch64
            runner: macos-15
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build
          path: zig-out
      - name: Install VM dependencies
        if: matrix.release != ''
        shell: bash
        env:
          TEST_ARCH: ${{ matrix.arch }}
        run: |
          case "$TEST_ARCH" in
            x86_64) qemu_package=qemu-system-x86 ;;
            aarch64) qemu_package=qemu-system-arm ;;
            *) echo "Unsupported VM architecture: $TEST_ARCH" >&2; exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "$qemu_package" zstd openssh-client
      - name: Run tests
        shell: bash
        env:
          TEST_OS: ${{ matrix.os }}
          TEST_ARCH: ${{ matrix.arch }}
          TEST_RELEASE: ${{ matrix.release }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=("$TEST_ARCH" "$TEST_OS")
          if [ -n "$TEST_RELEASE" ]; then
            args+=("$TEST_RELEASE")
          fi
          sh ci/test.sh "${args[@]}"

  release:
    needs: [build, test]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/release-'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build
          path: zig-out
      - run: bash ci/release.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HRC_VERSION: ${{ needs.build.outputs.version }}
