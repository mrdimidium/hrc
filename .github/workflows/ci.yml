name: CI

on:
  push:
    branches: [main, "release/*"]
    tags: ["release-[0-9]*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/release-') }}

jobs:
  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
        include:
          - os: linux
            runner: ubuntu-latest
          - os: darwin
            runner: macos-15
          - os: windows
            runner: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Authenticate GitHub downloads
        shell: bash
        env:
          GH_DOWNLOAD_TOKEN: ${{ github.token }}
        run: |
          umask 077
          netrc="$RUNNER_TEMP/bazel-github.netrc"
          printf 'machine github.com\nlogin x-access-token\npassword %s\n' "$GH_DOWNLOAD_TOKEN" > "$netrc"
          printf 'NETRC=%s\n' "$netrc" >> "$GITHUB_ENV"

      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-version: '1.x'

      - name: Check licenses and lint
        if: matrix.os != 'windows'
        run: |
          bash -n tools/release.sh
          bazel run //tools:reuse -- --root "$GITHUB_WORKSPACE" lint
          bazel build --config=lint --@aspect_rules_lint//lint:fail_on_violation=true --output_groups=rules_lint_human //:starlark_sources

      - id: build
        shell: bash
        env:
          BAZEL_SH: ${{ matrix.os == 'windows' && 'C:/Program Files/Git/bin/bash.exe' || 'bash' }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          # Git Bash matches prefixes of whole arguments, including option names.
          MSYS2_ARG_CONV_EXCL: "//;--platforms="
        run: |
          bazel build //cmd:release --platforms="//tools:${TARGET_OS}_${TARGET_ARCH}" --jobs=2
          target=$(tar -xOf bazel-bin/cmd/release.tar.gz ./TARGET | tr -d '\r\n')
          [[ "$target" == "$TARGET_ARCH-$TARGET_OS" ]]
          version=$(awk '$1 == "STABLE_HRC_VERSION" { print $2 }' bazel-out/stable-status.txt)
          : "${version:?Missing STABLE_HRC_VERSION}"
          archive="hrc-$target-$version.tar.gz"
          mkdir -p dist/release
          cp bazel-bin/cmd/release.tar.gz "dist/release/$archive"
          cd dist/release
          if command -v sha256sum >/dev/null; then
            digest=$(sha256sum --binary "$archive")
          else
            digest=$(shasum -a 256 --binary "$archive")
          fi
          printf '%s  %s\n' "${digest%% *}" "$archive" > "SHASUMS256-$TARGET_ARCH-$TARGET_OS.txt"
          printf '%s\n' "$version" > VERSION
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          bazel test //:tests --nostamp --workspace_status_command= --test_output=errors

      - name: Attest build archives
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/release-'))
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/release/SHASUMS256-${{ matrix.arch }}-${{ matrix.os }}.txt
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-${{ matrix.arch }}-${{ matrix.os }}
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Remove download credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/bazel-github.netrc"

  release:
    needs: [build]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/release-'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: build-*
          merge-multiple: true
          path: dist/release
      - name: Authenticate GitHub downloads
        env:
          GH_DOWNLOAD_TOKEN: ${{ github.token }}
        run: |
          umask 077
          netrc="$RUNNER_TEMP/bazel-github.netrc"
          printf 'machine github.com\nlogin x-access-token\npassword %s\n' "$GH_DOWNLOAD_TOKEN" > "$netrc"
          printf 'NETRC=%s\n' "$netrc" >> "$GITHUB_ENV"

      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-version: '1.x'
      - name: Verify and publish release
        run: bash tools/release.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HRC_VERSION: ${{ needs.build.outputs.version }}
          HRC_ARTIFACT_SOURCE: https://github.com/${{ github.repository }}/releases/download/${{ github.ref == 'refs/heads/main' && 'dev' || github.ref_name }}

      - name: Remove download credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/bazel-github.netrc"
