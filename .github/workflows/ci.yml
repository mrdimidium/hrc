name: CI

on:
  push:
    branches: [main]
    tags: ["release-[0-9]*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/release-') }}

jobs:
  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
        include:
          - os: linux
            runner: ubuntu-latest
          - os: darwin
            runner: macos-15
          - os: windows
            runner: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: true

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: ${{ matrix.os == 'windows' && 'bazel uv' || '' }}

      - name: Check licenses and lint
        if: matrix.os != 'windows'
        run: aspect ci check

      - id: build
        shell: bash
        env:
          BAZEL_SH: ${{ matrix.os == 'windows' && 'C:/Program Files/Git/bin/bash.exe' || 'bash' }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          # Git Bash matches prefixes of whole arguments, including option names.
          MSYS2_ARG_CONV_EXCL: "//;--platforms="
        run: |
          bazel build //cmd:release --platforms="//tools:${TARGET_OS}_${TARGET_ARCH}" --jobs=2
          target=$(tar -xOf bazel-bin/cmd/release.tar.gz ./TARGET | tr -d '\r\n')
          [[ "$target" == "$TARGET_ARCH-$TARGET_OS" ]]
          version=$(awk '$1 == "STABLE_HRC_VERSION" { print $2 }' bazel-out/stable-status.txt)
          : "${version:?Missing STABLE_HRC_VERSION}"
          archive="hrc-$target-$version.tar.gz"
          mkdir -p dist/release
          cp bazel-bin/cmd/release.tar.gz "dist/release/$archive"
          cd dist/release
          if command -v sha256sum >/dev/null; then
            digest=$(sha256sum --binary "$archive")
          else
            digest=$(shasum -a 256 --binary "$archive")
          fi
          printf '%s  %s\n' "${digest%% *}" "$archive" > "SHASUMS256-$TARGET_ARCH-$TARGET_OS.txt"
          printf '%s\n' "$version" > VERSION
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          uv run --no-project --python 3.13 python -m unittest discover -s runner -p '*_test.py'
          bazel test //cmd:cmd_test --nostamp --workspace_status_command= --test_output=errors

      - name: Attest build archives
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/release-'))
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/release/SHASUMS256-${{ matrix.arch }}-${{ matrix.os }}.txt
          create-storage-record: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-${{ matrix.arch }}-${{ matrix.os }}
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    needs: [build]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/release-'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: build-*
          merge-multiple: true
          path: dist/release
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: github:aspect-build/aspect-cli
      - name: Verify and merge build artifacts
        shell: bash
        env:
          HRC_VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd dist/release
          : > SHASUMS256.txt
          for target in amd64-linux arm64-linux amd64-darwin arm64-darwin amd64-windows arm64-windows; do
            manifest="SHASUMS256-$target.txt"
            [[ $(wc -l < "$manifest") -eq 1 ]]
            read -r digest archive < "$manifest"
            [[ "$archive" == "hrc-$target-$HRC_VERSION.tar.gz" ]]
            sha256sum --check "$manifest"
            cat "$manifest" >> SHASUMS256.txt
          done
          sort -o SHASUMS256.txt SHASUMS256.txt
      - run: aspect ci release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HRC_VERSION: ${{ needs.build.outputs.version }}
