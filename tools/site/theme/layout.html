<!DOCTYPE html>
<html lang="{{ language|e }}">
<head>
  <meta charset="utf-8" />
  {{ metatags }}
  <title>{{ title|striptags|e }} · {{ project|e }}</title>
  <link rel="icon" href="{{ pathto('favicon.ico', resource=True)|e }}" sizes="32x32" />
  <link rel="icon" href="{{ pathto('favicon.svg', resource=True)|e }}" type="image/svg+xml" sizes="any" />
  <link rel="apple-touch-icon" href="{{ pathto('apple-touch-icon.png', resource=True)|e }}" sizes="180x180" />
  <link rel="manifest" href="{{ pathto('manifest.webmanifest', resource=True)|e }}" />
  <link rel="stylesheet" href="{{ pathto('_static/' ~ site_css, resource=True)|e }}" />
  <link rel="alternate" type="text/plain" href="{{ pathto(pagename ~ '.txt', resource=True)|e }}" />
  {% if has_tabs %}
  <script src="{{ pathto('_static/' ~ site_js, resource=True)|e }}" defer></script>
  {% endif %}
</head>
<body class="page">
  {% include "components/page/page.html" %}
</body>
</html>
