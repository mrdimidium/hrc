[settings]
lockfile = true

[tools]
uv = "0.13.6"
bazel = "9.3.1"
"pipx:reuse" = { version = "6.3.0", extras = "charset-normalizer" }

[tools."github:aspect-build/aspect-cli"]
version = "v2026.44.7"
os = ["linux", "macos"]
bin = "aspect"
matching_regex = "^aspect-cli-(x86_64|aarch64)-(apple-darwin|unknown-linux-musl)$"
